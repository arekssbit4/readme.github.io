<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Мои файлы</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .file { padding: 10px; border-bottom: 1px solid #eee; }
        .file:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>📁 Файлы на GitHub Pages</h1>
    <div id="files">Загрузка списка файлов...</div>
    
    <script>
    // Используем GitHub API для получения списка файлов
    fetch('https://api.github.com/repos/readme/readme.github.io/contents/')
        .then(response => response.json())
        .then(files => {
            let html = '';
            files.forEach(file => {
                if(file.type === 'file' && !file.name.startsWith('.')) {
                    const sizeKB = (file.size / 1024).toFixed(1);
                    html += `
                        <div class="file">
                            📄 <a href="${file.download_url}" target="_blank">${file.name}</a>
                            <span style="color: #666; margin-left: 10px;">(${sizeKB} KB)</span>
                        </div>
                    `;
                }
            });
            document.getElementById('files').innerHTML = html || 'Файлов нет';
        })
        .catch(error => {
            document.getElementById('files').innerHTML = 'Ошибка загрузки списка. Возможно, репозиторий пуст.';
        });
    </script>
    
    <hr>
    <h2>Как использовать через CMD:</h2>
    <pre>
# Прочитать файл:
curl https://readme.github.io/данные.txt

# Скачать файл:
curl https://readme.github.io/логи.txt -o логи.txt
    </pre>
</body>
</html>
